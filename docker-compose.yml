services:
  classroom-display:
    build: .
    container_name: classroom-display
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    env_file:
      - .env
    environment:
      PORT: "${PORT:-8080}"
      APP_ENV: "${APP_ENV:-development}"
      COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      CHURCH_TIMEZONE: "${CHURCH_TIMEZONE:-America/Chicago}"
    volumes:
      - ./data:/app/data
